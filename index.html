<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Lun">
<meta name="theme-color" content="#7cc6fb">
<title>Catatan Lun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#e8f5ff;--bg2:#ffffff;--card:#ffffff;--ink:#16406b;--soft:#5c88b0;--sky:#7cc6fb;--sky2:#bfe4ff;--deep:#2b9af0;--line:#d3eaff;--ok:#3cc88f;--shadow:0 8px 24px rgba(43,154,240,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f2540;--bg2:#143152;--card:#183a60;--ink:#e6f4ff;--soft:#9cc3e6;--sky:#4aa9ee;--sky2:#27517f;--deep:#6cc0ff;--line:#264d78;--shadow:0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f2540;--bg2:#143152;--card:#183a60;--ink:#e6f4ff;--soft:#9cc3e6;--sky:#4aa9ee;--sky2:#27517f;--deep:#6cc0ff;--line:#264d78;--shadow:0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
.cloud{position:fixed;background:var(--card);border-radius:60px;opacity:.7;z-index:0;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:140%;left:12%;top:-60%}.cloud::after{width:40%;height:110%;right:14%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mascot{width:78px;height:62px;flex:none;cursor:pointer;transition:transform .2s}
.mascot:hover{transform:rotate(-6deg) scale(1.06)}
.mascot.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-16px) scale(1.08)}60%{transform:translateY(0) scale(.96,1.05)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.brand h1{font-size:2rem;line-height:1;color:var(--deep);font-weight:800}
.brand p{margin:2px 0 0;color:var(--soft);font-weight:700;font-size:.92rem}
.clock{margin-left:auto;text-align:right}
.clock b{font-family:'Baloo 2',sans-serif;font-size:1.7rem;color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1}
.clock span{font-size:.78rem;color:var(--soft);font-weight:700}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;border:2px solid var(--line)}
.tabs{display:flex;gap:6px;background:var(--sky2);padding:5px;border-radius:999px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;font:inherit;font-weight:800;color:var(--ink);padding:10px;border-radius:999px;cursor:pointer;transition:background .25s,transform .15s}
.tab:active{transform:scale(.95)}
.tab.on{background:var(--card);color:var(--deep);box-shadow:0 3px 10px rgba(43,154,240,.2)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.82rem;color:var(--soft)}
label.full{grid-column:1/-1}
input{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--deep);box-shadow:0 0 0 4px rgba(43,154,240,.2)}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;background:var(--deep);color:#fff;transition:transform .15s,box-shadow .2s;box-shadow:0 5px 0 rgba(20,100,180,.35)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,100,180,.35)}
.btn.ghost{background:var(--sky2);color:var(--ink);box-shadow:none}
form .btn{grid-column:1/-1}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:14px;background:var(--sky2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--deep));border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.prog b{font-family:'Baloo 2',sans-serif;color:var(--deep);min-width:64px;text-align:right}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px;position:relative;animation:pop .45s cubic-bezier(.3,1.6,.5,1);transition:background .3s,opacity .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.task.done{opacity:.65}.task.done .t{text-decoration:line-through}
.task.due{border-color:var(--deep);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(43,154,240,.25)}}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--sky);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s;position:relative}
.chk:hover{transform:scale(1.12)}
.chk svg{width:18px;height:18px;stroke:#fff;stroke-width:4;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s}
.done .chk{background:var(--ok);border-color:var(--ok)}.done .chk svg{stroke-dashoffset:0}
.info{flex:1;min-width:0}.t{font-weight:800;overflow-wrap:anywhere}
.n{font-size:.86rem;margin-top:4px;color:var(--ink);background:var(--card);border-radius:10px;padding:5px 9px;overflow-wrap:anywhere}
.m{font-size:.82rem;color:var(--soft);font-weight:700;display:flex;gap:10px;flex-wrap:wrap}
.del{border:0;background:transparent;color:var(--soft);font-size:1.3rem;cursor:pointer;border-radius:50%;width:34px;height:34px;transition:background .2s,transform .2s}
.del:hover{background:var(--sky2);transform:rotate(90deg)}
.cal{border:0;background:var(--sky2);border-radius:50%;width:34px;height:34px;cursor:pointer;transition:transform .2s}.cal:hover{transform:scale(1.15) rotate(-8deg)}
.empty{text-align:center;color:var(--soft);font-weight:700;padding:18px 6px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
.day{flex:none;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:18px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;text-align:center;min-width:84px;transition:transform .15s,background .2s}
.day:hover{transform:translateY(-3px)}
.day.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.day small{display:block;font-weight:700;opacity:.8}
.hist-head{display:flex;gap:10px;align-items:end;margin-bottom:10px}.hist-head label{flex:1}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:var(--deep);color:#fff;border-radius:18px;padding:12px 16px;font-weight:800;box-shadow:0 10px 30px rgba(20,100,180,.4);max-width:420px;width:100%;animation:drop .5s cubic-bezier(.3,1.5,.5,1);display:flex;gap:10px;align-items:center}
.toast button{margin-left:auto;border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:4px 10px;font:inherit;font-weight:800;cursor:pointer}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.dot{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:60}
.perm{display:flex;gap:10px;align-items:center;font-size:.85rem;font-weight:700;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.clock b{font-size:1.35rem}.brand h1{font-size:1.6rem}.mascot{width:60px}}
</style>
</head>
<body>
<div class="cloud" style="width:140px;height:40px;top:12%;animation-duration:70s"></div>
<div class="cloud" style="width:100px;height:30px;top:55%;animation-duration:95s;animation-delay:-40s"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<main>
<header>
  <svg class="mascot" id="mascot" viewBox="0 0 78 62" aria-label="Maskot Lun" role="img">
    <path d="M18 54a16 16 0 0 1-2-31 20 20 0 0 1 38-4 17 17 0 0 1 8 35z" fill="#fff" stroke="#7cc6fb" stroke-width="4" stroke-linejoin="round"/>
    <ellipse class="eye" cx="30" cy="38" rx="3.2" ry="4.2" fill="#16406b"/><ellipse class="eye" cx="48" cy="38" rx="3.2" ry="4.2" fill="#16406b"/>
    <path id="mouth" d="M33 45q6 6 12 0" stroke="#16406b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="24" cy="44" r="3.5" fill="#ffb3c7" opacity=".8"/><circle cx="54" cy="44" r="3.5" fill="#ffb3c7" opacity=".8"/>
  </svg>
  <div class="brand"><h1>Catatan Lun</h1><p id="greet">Halo! Yuk atur harimu</p></div>
  <div class="clock"><b id="clk">00:00:00</b><span id="dt"></span></div>
</header>

<div class="tabs" role="tablist">
  <button class="tab on" data-tab="today" role="tab">Hari ini</button>
  <button class="tab" data-tab="hist" role="tab">Riwayat</button>
</div>

<section id="v-today">
  <div class="card">
    <h2 style="margin-bottom:10px">Tambah kegiatan</h2>
    <form id="f">
      <label>Tanggal<input type="date" id="fd" required></label>
      <label>Jam<input type="time" id="ft" required></label>
      <label class="full">Kegiatan<input type="text" id="fk" placeholder="Contoh: Belanja sayur" maxlength="80" required></label>
      <label class="full">Keterangan<input type="text" id="fn" placeholder="Contoh: Bawa tas belanja dan daftar belanjaan" maxlength="140"></label>
      <label class="full">Lokasi<input type="text" id="fl" placeholder="Contoh: Pasar Minggu" maxlength="60"></label>
      <button class="btn" type="submit">Simpan kegiatan</button>
    </form>
  </div>
  <div class="card">
    <div class="prog"><h2>Hari ini</h2><div class="bar"><i id="bar"></i></div><b id="pt">0/0</b></div>
    <ul id="list"></ul>
    <div class="perm" id="perm" style="margin-top:12px"></div>
    <button class="btn ghost" id="tb" type="button" style="margin-top:10px;padding:8px 14px">🔊 Tes bunyi pengingat</button>
    <button class="btn ghost" id="tc" type="button" style="margin-top:10px;padding:8px 14px">📅 Tambah semua ke Kalender</button>
  </div>
</section>

<section id="v-up">
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px"><h2>Kegiatan mendatang</h2><b id="upc" style="color:var(--soft);font-size:.9rem"></b></div>
    <ul id="uplist"></ul>
  </div>
</section>

<section id="v-hist" hidden>
  <div class="card">
    <h2 style="margin-bottom:10px">Riwayat catatan</h2>
    <div class="hist-head"><label>Cari tanggal<input type="date" id="hd"></label><button class="btn ghost" id="hreset" type="button">Semua</button></div>
    <div class="days" id="days"></div>
    <h3 id="hlabel" style="margin:4px 0 10px;color:var(--deep)"></h3>
    <ul id="hlist"></ul>
  </div>
</section>
</main>

<script src="config.js"></script>
<script>
(function(){
var KEY='catatan-lun-v1',tasks=[],sel=null;
try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}queueSync()}
var $=function(i){return document.getElementById(i)};
var p2=function(n){return String(n).padStart(2,'0')};
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function nowStr(){var d=new Date();return ymd(d)}
function nice(s,short){var d=new Date(s+'T00:00:00');return d.toLocaleDateString('id-ID',short?{weekday:'short',day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function byTime(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}

function hop(sad){var m=$('mascot');m.classList.remove('hop');void m.getBoundingClientRect();m.classList.add('hop');
  $('mouth').setAttribute('d',sad?'M33 49q6 -5 12 0':'M33 44q6 8 12 0')}
$('mascot').onclick=function(){hop();toast('Semangat! Satu langkah kecil tetap maju.',2600)};

function confetti(el){var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#7cc6fb','#2b9af0','#ffffff','#bfe4ff','#ffd966','#ff9fbd'];
  for(var i=0;i<16;i++){var d=document.createElement('div');d.className='dot';d.style.left=cx+'px';d.style.top=cy+'px';d.style.background=cols[i%6];document.body.appendChild(d);
    var a=Math.PI*2*i/16,dist=40+Math.random()*50;
    d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*dist+'px,'+(Math.sin(a)*dist+30)+'px) scale(.2)',opacity:0}],{duration:800,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=(function(x){return function(){x.remove()}})(d)}}

function clock(){var d=new Date();$('clk').textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
  $('dt').textContent=nice(ymd(d),true);var h=d.getHours();
  $('greet').textContent=(h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+'! Yuk atur harimu';}

var ac;function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);function beep(){unlock();try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var cp=ac.createDynamicsCompressor();cp.connect(ac.destination);[880,1175,880,1175,880,1175,1320,1760].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(cp);var t=ac.currentTime+i*.24;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9,t+.02);g.gain.setValueAtTime(.9,t+.14);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)});try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,500])}catch(e){}}catch(e){}}
function toast(msg,ms){var t=document.createElement('div');t.className='toast';t.innerHTML='<span>'+esc(msg)+'</span><button type="button">Tutup</button>';
  $('toasts').appendChild(t);var rm=function(){t.remove()};t.querySelector('button').onclick=rm;setTimeout(rm,ms||12000)}

function item(t,dueNow){var li=document.createElement('li');li.className='task'+(t.done?' done':'')+(dueNow?' due':'');
  li.innerHTML='<button class="chk" type="button" aria-label="Tandai selesai"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></button><div class="info"><div class="t">'+esc(t.title)+'</div><div class="m"><span>'+(t.date!==nowStr()?'📆 '+nice(t.date,true)+' · ':'')+'🕒 '+esc(t.time)+'</span>'+(t.place?'<span>📍 '+esc(t.place)+'</span>':'')+'</div>'+(t.note?'<div class="n">'+esc(t.note)+'</div>':'')+'</div><button class="cal" type="button" aria-label="Tambah ke Kalender" title="Tambah ke Kalender">📅</button><button class="del" type="button" aria-label="Hapus">×</button>';
  li.querySelector('.chk').onclick=function(e){t.done=!t.done;save();if(t.done){confetti(e.currentTarget);hop();}render()};
  li.querySelector('.cal').onclick=function(){toCal([t],'kegiatan-'+t.date)};li.querySelector('.del').onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();hop(true);render()};
  return li}

function fill(ul,arr,msg){ul.innerHTML='';if(!arr.length){ul.innerHTML='<li class="empty">'+msg+'</li>';return}
  var n=new Date(),hm=p2(n.getHours())+':'+p2(n.getMinutes());arr.forEach(function(t){ul.appendChild(item(t,!t.done&&t.date===nowStr()&&t.time===hm))})}

function render(){var td=nowStr(),a=tasks.filter(function(t){return t.date===td}).sort(byTime),dn=a.filter(function(t){return t.done}).length;
  fill($('list'),a,'Belum ada kegiatan hari ini. Tambahkan yang pertama di atas ☁️');
  var up=tasks.filter(function(t){return t.date>td}).sort(byTime);$('upc').textContent=up.length?up.length+' kegiatan':'';fill($('uplist'),up,'Belum ada kegiatan di tanggal mendatang 📅');
  $('pt').textContent=dn+'/'+a.length;$('bar').style.width=(a.length?dn/a.length*100:0)+'%';
  if(a.length&&dn===a.length&&!render.cel){render.cel=1;toast('Hebat! Semua kegiatan hari ini selesai 🎉',5000)}if(dn<a.length)render.cel=0;
  // riwayat
  var dates=[];tasks.forEach(function(t){if(dates.indexOf(t.date)<0)dates.push(t.date)});dates.sort().reverse();
  var dv=$('days');dv.innerHTML='';
  dates.forEach(function(d){var c=tasks.filter(function(t){return t.date===d}),k=c.filter(function(t){return t.done}).length,b=document.createElement('button');
    b.type='button';b.className='day'+(sel===d?' on':'');b.innerHTML=nice(d,true)+'<small>'+k+'/'+c.length+' selesai</small>';
    b.onclick=function(){sel=d;$('hd').value=d;render()};dv.appendChild(b)});
  if(!dates.length)dv.innerHTML='<span class="empty">Belum ada catatan tersimpan.</span>';
  var h=sel?tasks.filter(function(t){return t.date===sel}):tasks.slice();h.sort(byTime);if(!sel)h.reverse();
  $('hlabel').textContent=sel?nice(sel):'Semua catatan';
  fill($('hlist'),h,sel?'Tidak ada catatan di tanggal ini.':'Belum ada riwayat.');
  permUI()}

function permUI(){var p=$('perm');if(CFG.worker){pushUI(p);return}if(!('Notification' in window)){p.textContent='Pengingat muncul di dalam halaman ini.';return}
  if(Notification.permission==='default'){p.innerHTML='<span>🔔 Aktifkan notifikasi browser?</span><button class="btn ghost" type="button" id="pb" style="padding:6px 12px">Aktifkan</button>';
    $('pb').onclick=function(){Notification.requestPermission().then(permUI)}}
  else p.textContent=Notification.permission==='granted'?'🔔 Notifikasi aktif. Biarkan halaman ini terbuka.':'Notifikasi browser diblokir, pengingat tetap muncul di halaman.'}

function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsDT(date,time,add){var p=date.split('-'),q=time.split(':'),d=new Date(+p[0],+p[1]-1,+p[2],+q[0],+q[1]+(add||0));return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00'}
function makeICS(arr){var st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Catatan Lun//ID','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  arr.forEach(function(t){L.push('BEGIN:VEVENT','UID:'+t.id+'@catatan-lun','DTSTAMP:'+st,'DTSTART:'+icsDT(t.date,t.time),'DTEND:'+icsDT(t.date,t.time,60),'SUMMARY:'+icsEsc(t.title));
    if(t.place)L.push('LOCATION:'+icsEsc(t.place));if(t.note)L.push('DESCRIPTION:'+icsEsc(t.note));
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.title),'TRIGGER:PT0M','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('10 menit lagi: '+t.title),'TRIGGER:-PT10M','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')}
function toCal(arr,name){if(!arr.length){toast('Belum ada kegiatan untuk ditambahkan.',3000);return}
  var fr=false;try{fr=window.self!==window.top}catch(e){fr=true}
  if(fr){toast('Tombol kalender aktif setelah website dibuka langsung atau diunggah ke GitHub Pages, bukan di pratinjau ini.',9000);return}
  try{var b=new Blob([makeICS(arr)],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Buka file .ics yang terunduh, lalu ketuk Tambahkan ke Kalender.',7000)}catch(e){toast('Gagal membuat file kalender.',4000)}}
/* ===== Web Push ===== */
var CFG=window.LUN_CONFIG||{worker:'',vapid:''},pSub=null,pTimer=null;
function b64u(s){var r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function swOK(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function standalone(){return navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function queueSync(){if(!pSub)return;clearTimeout(pTimer);pTimer=setTimeout(syncPush,800)}
function syncPush(){if(!pSub||!CFG.worker)return Promise.resolve();var td=nowStr();
  var pend=tasks.filter(function(t){return !t.done&&t.date>=td}).slice(0,200).map(function(t){return{id:t.id,date:t.date,time:t.time,title:t.title,place:t.place||'',note:t.note||''}});
  return fetch(CFG.worker.replace(/\/$/,'')+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sub:pSub.toJSON(),tz:new Date().getTimezoneOffset(),tasks:pend})}).catch(function(){})}
function enablePush(){if(!swOK()){toast('Browser belum mendukung push. Di iPhone, buka dari ikon Layar Utama.',6000);return}
  Notification.requestPermission().then(function(r){if(r!=='granted'){permUI();return}
    return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CFG.vapid)})})}).then(function(s){pSub=s;return syncPush()}).then(function(){toast('Push aktif! Pengingat tetap datang walau aplikasi ditutup.',5000);permUI()})}).catch(function(e){toast('Gagal mengaktifkan push: '+(e&&e.message||e),8000)})}
function pushUI(p){if(!swOK()){p.textContent=/iPhone|iPad/.test(navigator.userAgent)&&!standalone()?'🔔 Untuk notifikasi saat aplikasi tertutup: ketuk Bagikan, Tambah ke Layar Utama, lalu buka dari ikon.':'Push tidak didukung di browser ini; pengingat muncul di dalam halaman.';return}
  if(Notification.permission==='granted'&&pSub){p.textContent='🔔 Push aktif: pengingat tetap datang walau aplikasi ditutup.';return}
  if(Notification.permission==='denied'){p.textContent='Notifikasi diblokir. Aktifkan lagi lewat Pengaturan perangkat.';return}
  p.innerHTML='<span>🔔 Aktifkan push agar pengingat tetap datang saat aplikasi ditutup?</span><button class="btn ghost" type="button" id="pb" style="padding:6px 12px">Aktifkan</button>';$('pb').onclick=enablePush}
function initPush(){if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(reg){if(!CFG.worker||!swOK())return;
    return reg.pushManager.getSubscription().then(function(s){if(s&&Notification.permission==='granted'){pSub=s;syncPush();permUI()}})}).catch(function(){})}
$('f').onsubmit=function(e){e.preventDefault();
  tasks.push({id:Date.now()+''+Math.random().toString(16).slice(2,6),date:$('fd').value,time:$('ft').value,title:$('fk').value.trim(),place:$('fl').value.trim(),note:$('fn').value.trim(),done:false,notified:false});
  save();$('fk').value='';$('fl').value='';$('fn').value='';hop();toast('Tersimpan! Lun mengingatkan pada '+nice(tasks[tasks.length-1].date,true)+' jam '+tasks[tasks.length-1].time,3500);render()};

function tab(n){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===n)});
  $('v-today').hidden=n!=='today';$('v-up').hidden=n!=='today';$('v-hist').hidden=n!=='hist'}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab(b.dataset.tab)}});
$('tc').onclick=function(){toCal(tasks.filter(function(t){return t.date===nowStr()&&!t.done}).sort(byTime),'catatan-lun-'+nowStr())};
$('tb').onclick=function(){beep();toast('Begini bunyi pengingatnya 🔔',2500)};
$('hd').onchange=function(){sel=this.value||null;render()};
$('hreset').onclick=function(){sel=null;$('hd').value='';render()};

function check(){var n=new Date(),td=ymd(n),hm=p2(n.getHours())+':'+p2(n.getMinutes()),fire=false;
  tasks.forEach(function(t){if(!t.done&&!t.notified&&t.date===td&&t.time<=hm&&t.time>=p2(n.getHours()-1)+':'+hm.slice(3)){
    t.notified=true;fire=true;toast('⏰ Waktunya: '+t.title+(t.place?' di '+t.place:'')+' ('+t.time+')'+(t.note?' - '+t.note:''));beep();hop();
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Catatan Lun: '+t.title,{body:'Jam '+t.time+(t.place?' • '+t.place:'')})}catch(e){}}});
  if(fire){save();render()}}

$('fd').value=nowStr();var nn=new Date();$('ft').value=p2(nn.getHours())+':'+p2((nn.getMinutes()+5)%60);
clock();render();check();initPush();
var lastMin='';setInterval(function(){clock();check();var m=new Date().getMinutes();if(m!==lastMin){lastMin=m;render()}},1000);
})();
</script>
</body>
</html>
